services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel_dev_password}@postgres:5432/${POSTGRES_DB:-sentinel}
      JWT_SECRET: ${JWT_SECRET:-local_dev_secret_change_me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 4310
    ports:
      - "4310:4310"
    command: sh -c "npm run prisma:generate && npm run db:deploy && npm run dev:server"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4310/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: build
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4310}
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4310}
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  adminer:
    image: adminer:latest
    ports:
      - "18082:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
